<canvas id="c" width="936" height="936"></canvas><p id="status">loading</p><script src="rive.js"></script><script>
(async()=>{try{rive.RuntimeLoader.setWasmUrl('rive.wasm');let themes=await(await fetch('params.json')).json(), c=document.getElementById('c');let instance=new rive.Rive({src:'focus_screen.riv',artboard:'plant ball',stateMachine:'State Machine 1',autoBind:true,autoplay:true,canvas:c,layout:new rive.Layout({fit:rive.Fit.Contain}),onLoad:async()=>{try{let vm=instance.viewModelInstance;let e=document.createElement('canvas');e.width=e.height=1;let im=await rive.decodeImage(new Uint8Array(await (await new Promise(r=>e.toBlob(r))).arrayBuffer()));for(let n of ['vmTreePlantBall','vmTreeResult1','vmTreeResult2','vmTreeResult3','vmTreeResult4']){let p=vm.image(n+'/imgTree');if(p)p.value=im}let out={};for(let i of themes){vm.image('imgTheme').value=await rive.decodeImage(new Uint8Array(await(await fetch('theme_'+i+'.webp')).arrayBuffer()));await new Promise(r=>setTimeout(r,500));out[i]=c.toDataURL('image/webp',.98)}await fetch('/save',{method:'POST',body:JSON.stringify(out)});document.getElementById('status').textContent='done'}catch(e){document.getElementById('status').textContent='error '+e.stack}},onLoadError:e=>document.getElementById('status').textContent='error '+e});}catch(e){document.getElementById('status').textContent='error '+e.stack}})();
</script>
