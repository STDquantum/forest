<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forest · 我的森林</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23A3D9C6'/%3E%3Cpath d='M16 44 Q32 12 48 44 Z' fill='%233B8F5F'/%3E%3C/svg%3E">
<style>
/* ===== 基础 ===== */
:root{
  --accent:#3B8F5F; --accent-soft:rgba(59,143,95,.16);
  --txt:#2E3A33; --txt-sub:#5C6B62; --card:#FFFFFF; --mask:rgba(18,28,24,.45);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  background:#BDE5CE; color:var(--txt); overflow:hidden;
  -webkit-user-select:none; user-select:none;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;}
img{-webkit-user-drag:none;}
.image-missing{visibility:hidden;}

/* ===== 背景分层（对应 activity_main.xml 的 background_gradient_container / background_image / canvas_view）===== */
#bg-gradient{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#A3D9C6 0%,#8BC7B2 55%,#74B29D 100%);transition:background 1s;}
#bg-image{position:fixed;inset:0;z-index:1;opacity:.35;pointer-events:none;}
#bg-image img{width:100%;height:100%;object-fit:cover;}
#cloud-scene{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
.cloud{position:absolute;border-radius:999px;background:rgba(255,255,255,.5);filter:blur(2px);}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%;}
.cloud::before{width:60%;height:80%;left:-25%;top:-40%;}
.cloud::after{width:70%;height:90%;right:-30%;top:-35%;}
.c1{width:min(28vw,180px);height:46px;left:12%;top:16%;opacity:.9;animation:drift-near 29s ease-in-out infinite alternate -7s;}
.c2{width:min(22vw,140px);height:38px;left:64%;top:26%;opacity:.72;animation:drift-middle 47s cubic-bezier(.37,0,.63,1) infinite alternate -31s;}
.c3{width:min(18vw,110px);height:30px;left:38%;top:9%;opacity:.58;animation:drift-far 71s ease-in-out infinite alternate -46s;}
@keyframes drift-near{from{transform:translate(-4vw,0)}to{transform:translate(7vw,8px)}}
@keyframes drift-middle{from{transform:translate(3vw,-5px)}to{transform:translate(-6vw,5px)}}
@keyframes drift-far{from{transform:translate(-2vw,3px)}to{transform:translate(3vw,-3px)}}

/* ===== 顶栏（root_top）===== */
#top-bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.55);color:#2E3A33;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .15s;}
.icon-btn:active{transform:scale(.92);}
#timer-text{font-size:30px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.18);font-variant-numeric:tabular-nums;min-width:118px;text-align:center;}

/* ===== 球区（plant_ball 1:1 + 辉光 + 背景图 + 地面）===== */
#ball-stage{position:fixed;z-index:3;left:50%;top:calc(50% - 36px);transform:translate(-50%,-50%);width:min(76vw,430px,calc(100svh - 260px));aspect-ratio:1;display:flex;align-items:center;justify-content:center;}
#ball-deco{position:absolute;width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none;}
#ball-deco img{width:100%;height:100%;object-fit:contain;opacity:.9;transition:opacity .8s;}
#ball-back{position:absolute;width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none;}
#ball-back img{width:100%;height:100%;object-fit:contain;transition:opacity .8s;}
#ball-tree{position:absolute;width:50%;height:50%;top:16.25%;left:25%;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:width .5s,height .5s,top .5s,left .5s;}
#tree-img{width:100%;height:100%;object-fit:contain;transform-origin:0% 91.125%;transition:transform .45s cubic-bezier(.2,.9,.3,1.1);}
#ball-glow{position:absolute;width:120%;height:120%;background:radial-gradient(circle,var(--glow, rgba(255,255,255,.35)) 0%,rgba(255,255,255,0) 62%);mix-blend-mode:screen;pointer-events:none;transition:background .8s;}

/* ===== 标签（root_tag：圆点+树名）===== */
#tag-row{position:fixed;z-index:4;left:50%;bottom:96px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.88);padding:7px 16px;border-radius:999px;box-shadow:0 3px 12px rgba(0,0,0,.12);}
#tag-dot{width:9px;height:9px;border-radius:50%;background:#F5D342;box-shadow:0 0 0 3px rgba(245,211,66,.25);}
#tag-name{font-size:14px;font-weight:600;color:#2E3A33;white-space:nowrap;}

/* ===== 底部（root_bottom）===== */
#bottom-bar{position:fixed;bottom:0;left:0;right:0;z-index:5;padding:0 24px 30px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.plant-controls{width:min(100%,480px);display:flex;align-items:center;gap:20px;padding:12px 12px 12px 20px;border:1px solid rgba(255,255,255,.45);border-radius:24px;background:rgba(255,255,255,.64);box-shadow:0 8px 32px rgba(30,68,49,.08);backdrop-filter:blur(18px);}
#btn-plant{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;color:var(--txt);border-radius:12px;}
#btn-plant .tree-mark{width:38px;height:38px;flex:none;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.65);color:var(--accent);}
.tree-choice{min-width:0;display:flex;flex-direction:column;gap:4px;}
#tag-name{display:block;overflow:hidden;text-overflow:ellipsis;font-size:15px;}
.tree-choice-hint{font-size:12px;color:var(--txt-sub);}
#bottom-bar #btn-start{flex:none;width:148px;height:52px;border-radius:17px;font-size:16px;box-shadow:0 4px 12px var(--accent-soft);}
#btn-start:hover{filter:brightness(1.06);}
#btn-plant:hover .tree-choice-hint{color:var(--accent);}
#btn-plant:focus-visible,#btn-start:focus-visible{outline:3px solid var(--accent);outline-offset:4px;}
@media(max-width:420px){#bottom-bar{padding:0 16px max(20px,env(safe-area-inset-bottom));}.plant-controls{gap:12px;padding:10px 10px 10px 14px;}#btn-plant{gap:8px;}#bottom-bar #btn-start{width:118px;}#btn-plant .tree-mark{display:none;}}
.primary-btn{width:100%;max-width:420px;height:56px;border-radius:28px;font-size:17px;font-weight:700;color:#fff;background:var(--accent);box-shadow:0 6px 18px var(--accent-soft);transition:transform .15s,opacity .2s;}
.primary-btn:active{transform:scale(.97);}
.primary-btn:disabled{opacity:.55;}
#growing-info{text-align:center;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.2);font-size:14px;line-height:1.6;}
#progress-track{width:min(60vw,300px);height:8px;border-radius:4px;background:rgba(255,255,255,.4);overflow:hidden;margin-top:6px;}
#progress-fill{height:100%;width:0%;background:#fff;border-radius:4px;transition:width .4s linear;}
#btn-harvest{width:100%;max-width:420px;height:56px;border-radius:28px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,#F2A93B,#E97B2E);box-shadow:0 6px 18px rgba(233,123,46,.35);}

/* ===== 雪层（SnowfallView 复刻）===== */
#snow-layer{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden;opacity:0;transition:opacity 1.2s;}
body[data-theme="xmas"] #snow-layer{opacity:1;}
.flake{position:absolute;top:-40px;border-radius:50%;background:#fff;opacity:.55;animation:fall linear infinite;}
@keyframes fall{to{transform:translateY(108vh) rotate(360deg);}}

/* ===== 全屏特效层（fullscreen_lottie 简化）===== */
#fx-layer{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.5),rgba(255,255,255,0) 55%);}
#fx-layer.show{opacity:1;animation:fadefx 1.6s ease-out forwards;}
@keyframes fadefx{0%{opacity:1}100%{opacity:0}}

/* ===== 弹窗遮罩 + BottomSheet（SelectSpeciesBottomSheetDialog 复刻）===== */
.mask{position:fixed;inset:0;z-index:20;background:var(--mask);opacity:0;pointer-events:none;transition:opacity .3s;}
.mask.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:84vh;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);transform:translateY(108%);transition:transform .34s cubic-bezier(.22,.9,.3,1);display:flex;flex-direction:column;padding:14px 16px 22px;}
.sheet{visibility:hidden;}.sheet.open{visibility:visible;transform:translateY(0);}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.sheet-tabs{display:flex;gap:8px;background:#F1F5F3;border-radius:12px;padding:4px;}
.tab{padding:8px 18px;border-radius:9px;font-size:14px;font-weight:600;color:#5C6B62;}
.tab.active{background:#fff;color:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.08);}
.search{margin-bottom:10px;}
.search input{width:100%;height:42px;border:1.5px solid #E3EBE6;border-radius:12px;padding:0 14px;font-size:16px;outline:none;background:#FAFCFB;}
.search input:focus{border-color:var(--accent);}
.preview{display:flex;align-items:center;gap:14px;background:#F4F9F5;border-radius:16px;padding:10px 14px;margin-bottom:10px;min-height:92px;}
.preview-img{width:78px;height:78px;flex:none;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:14px;overflow:hidden;}
.preview-img img{width:100%;height:100%;object-fit:contain;}
.preview-info{flex:1;min-width:0;}
.favorite-button{flex:none;align-self:flex-start;padding:9px 13px;border:1px solid var(--accent);border-radius:12px;color:var(--accent);background:#fff;font-size:15px;white-space:nowrap;}
.favorite-button[aria-pressed="true"]{background:var(--accent-soft);}
.favorites-empty{grid-column:1/-1;padding:30px 14px;text-align:center;color:var(--txt-sub);line-height:1.8;}
#preview-name{font-size:16px;font-weight:700;color:#2E3A33;}
#preview-sub{max-height:5.5em;overflow-y:auto;font-size:12.5px;color:var(--txt-sub);margin-top:4px;line-height:1.5;}
#preview-sub b{color:var(--accent);}
.tree-grid{align-content:start;overflow-x:hidden;overflow-y:auto;flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:2px 2px 10px;min-height:0;}
@media(min-width:768px){.tree-grid{align-content:start;overflow-x:hidden;grid-template-columns:repeat(6,minmax(0,1fr));}}
.tree-cell{min-width:0;background:#F7FAF8;border:2px solid transparent;border-radius:14px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .15s,transform .12s;}
.tree-cell:active{transform:scale(.94);}
.tree-cell.sel{border-color:var(--accent);background:#EAF6EF;}
.tree-cell img{width:100%;aspect-ratio:1;object-fit:contain;}
.tree-cell .tname{font-size:11px;color:#4A5A51;text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tree-cell .tanim{font-size:9.5px;color:var(--accent);font-weight:600;}
.sheet-head,.search,.preview{flex-shrink:0;}
.plant-action{flex:none;padding-top:12px;margin-top:4px;border-top:1px solid #E7EEE9;background:#fff;padding-bottom:env(safe-area-inset-bottom,0px);}
#species-sheet{width:min(100%,760px);left:50%;right:auto;transform:translate(-50%,108%);}
#species-sheet.open{transform:translate(-50%,0);}
.plant-summary{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 4px 10px;font-size:12px;color:var(--txt-sub);}
#plant-selection{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--txt);}
.plant-duration{flex:none;font-variant-numeric:tabular-nums;}
#btn-confirm{width:100%;max-width:none;height:56px;min-height:56px;flex:none;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid rgba(0,0,0,.06);border-radius:16px;margin:0;font-size:17px;letter-spacing:.04em;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(0,0,0,.05)),var(--accent);box-shadow:0 4px 10px var(--accent-soft),inset 0 1px 0 rgba(255,255,255,.16);transition:filter .15s,transform .15s,box-shadow .15s;}
#btn-confirm svg{width:22px;height:22px;flex:none;}
#btn-confirm:hover{filter:brightness(1.06);box-shadow:0 6px 16px var(--accent-soft);}
#btn-confirm:active{transform:translateY(1px) scale(.99);}
#btn-confirm:focus-visible{outline:3px solid var(--accent);outline-offset:4px;}
.sheet.right{top:0;bottom:0;left:auto;right:0;width:min(340px,92vw);border-radius:24px 0 0 24px;transform:translateX(108%);padding-top:18px;}
.sheet.right.open{transform:translateX(0);}
.theme-grid{display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;padding:4px 2px;}
.theme-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:2px solid transparent;background:#F7FAF8;}
.theme-item.sel{border-color:var(--accent);background:#EAF6EF;}
.theme-swatch{width:46px;height:46px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(0,0,0,.06);}
.theme-swatch img{width:100%;height:100%;object-fit:cover;}
.theme-item .tinfo{flex:1;min-width:0;}
.theme-item .tinfo .tn{font-size:15px;font-weight:700;color:#2E3A33;}
.theme-item .tinfo .td{font-size:12px;color:var(--txt-sub);margin-top:2px;line-height:1.4;}
.theme-item .tcheck{font-size:15px;color:var(--accent);font-weight:800;}
#sheet-title{font-size:17px;font-weight:800;color:#2E3A33;}

/* ===== 主题：背景/球/地面（切换由 JS 设 data-theme + 变量）===== */
body[data-theme="default"]{--accent:#3B8F5F;--accent-soft:rgba(59,143,95,.2);}
body[data-theme="default"] #bg-gradient{background:linear-gradient(180deg,#A3D9C6 0%,#8BC7B2 55%,#74B29D 100%);}
body[data-theme="xmas"]{--accent:#2E5D8A;--accent-soft:rgba(46,93,138,.25);--glow:rgba(255,255,255,.5);}
body[data-theme="xmas"] #bg-gradient{background:linear-gradient(180deg,#3C4F77 0%,#2B3A5C 48%,#1E2A44 100%);}
body[data-theme="xmas"] #timer-text{color:#EAF3FF;}
body[data-theme="tinytan"]{--accent:#8A6BBE;--accent-soft:rgba(138,107,190,.22);}
body[data-theme="tinytan"] #bg-gradient{background:linear-gradient(180deg,#FCE9C4 0%,#F7D9A0 52%,#EFC685 100%);}
body[data-theme="softpink"]{--accent:#D9758F;--accent-soft:rgba(217,117,143,.22);}
body[data-theme="softpink"] #bg-gradient{background:linear-gradient(180deg,#FBDEE6 0%,#F5C6D4 55%,#EBB2C4 100%);}
body[data-theme="oceanblue"]{--accent:#2E8F9E;--accent-soft:rgba(46,143,158,.22);}
body[data-theme="oceanblue"] #bg-gradient{background:linear-gradient(180deg,#BDE7F2 0%,#8FD3E8 52%,#6BBEDD 100%);}
body[data-theme="creammeadow"]{--accent:#7FA85C;--accent-soft:rgba(127,168,92,.22);}
body[data-theme="creammeadow"] #bg-gradient{background:linear-gradient(180deg,#F0EDD6 0%,#E2E3B8 52%,#CBD9A2 100%);}
body[data-theme="sunlitlime"]{--accent:#A0A93B;--accent-soft:rgba(160,169,59,.22);}
body[data-theme="sunlitlime"] #bg-gradient{background:linear-gradient(180deg,#F7F3CE 0%,#EBEFB0 52%,#DDE391 100%);}
body[data-theme="blossomingturf"]{--accent:#4E9E63;--accent-soft:rgba(78,158,99,.22);}
body[data-theme="blossomingturf"] #bg-gradient{background:linear-gradient(180deg,#D9F2DC 0%,#BCE7C6 52%,#9AD8AC 100%);}
/* 各主题球/地面图由 JS 设置 img src */
/* 电脑端：放大阅读和选树区域，手机端沿用原尺寸。 */
@media(min-width:900px){
  #species-sheet{width:min(calc(100% - 64px),1080px);height:min(92vh,960px);max-height:92vh;padding:20px 24px 24px;border-radius:28px 28px 0 0;}
  #species-sheet .sheet-head{margin-bottom:14px;}
  #species-sheet .tab{font-size:17px;padding:10px 24px;}
  #species-sheet .search{margin-bottom:14px;}
  #species-sheet .search input{height:50px;font-size:18px;padding:0 18px;}
  #species-sheet .preview{gap:20px;padding:12px 18px;margin-bottom:16px;min-height:124px;}
  #species-sheet .preview-img{width:100px;height:100px;}
  #preview-name{font-size:22px;}
  #preview-sub{max-height:5.5em;overflow-y:auto;font-size:16px;line-height:1.65;}
  #species-sheet .tree-grid{align-content:start;overflow-x:hidden;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;padding-bottom:14px;}
  #species-sheet .tree-cell{min-width:0;padding:12px 8px 10px;gap:8px;border-radius:18px;}
  #species-sheet .tree-cell .tname{font-size:16px;line-height:1.5;}
  #species-sheet .tree-cell .tanim{font-size:13px;}
  .plant-action{padding-top:14px;}
  .plant-summary{font-size:16px;margin-bottom:12px;}
  #btn-confirm{height:64px;min-height:64px;font-size:21px;border-radius:18px;gap:12px;}
  #btn-confirm svg{width:26px;height:26px;}
  #ball-stage{width:min(52vw,540px,calc(100svh - 260px));}
  #timer-text{font-size:40px;}
  #tag-row{bottom:112px;padding:10px 20px;}
  #tag-name{font-size:18px;}
  #bottom-bar .primary-btn{max-width:480px;height:64px;font-size:20px;}
  #growing-info{font-size:18px;}
  #theme-sheet{width:400px;}
  #sheet-title{font-size:22px;}
  .theme-swatch{width:60px;height:60px;}
  .theme-item .tinfo .tn{font-size:18px;}
  .theme-item .tinfo .td{font-size:15px;}
}
#data-sync-status{flex:none;font-size:12px;color:var(--txt-sub);padding:0 4px 8px;}@media(min-width:900px){#data-sync-status{font-size:14px;padding-bottom:12px;}}
.editor-entry{width:auto;min-height:48px;padding:0 18px;gap:9px;border-radius:16px;font-size:17px;font-weight:700;background:rgba(255,255,255,.9);text-decoration:none;white-space:nowrap;}
.top-settings{display:flex;align-items:center;gap:10px;}
#language-select{max-width:125px;height:44px;padding:0 10px;border:1px solid rgba(255,255,255,.5);border-radius:16px;background:rgba(255,255,255,.72);color:var(--txt);font:inherit;font-size:14px;cursor:pointer;}
#language-select:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
@media(max-width:480px){.editor-entry{padding:0 12px;font-size:14px;gap:5px;}}
@media(max-width:480px){.editor-entry{max-width:calc(100vw - 194px);min-width:44px;padding:0 9px;font-size:12px;}.editor-entry svg{flex:none;}.editor-entry span{overflow:hidden;text-overflow:ellipsis;}#top-bar{padding:10px;}.top-settings{gap:6px;}#language-select{max-width:105px;font-size:13px;}.favorite-button{max-width:44%;white-space:normal;font-size:13px;}}
</style>
</head>
<body data-theme="default" data-state="plant">
  <!-- 背景分层 -->
  <div id="bg-gradient"></div>
  <div id="bg-image" hidden></div>
  <div id="cloud-scene"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i></div>

  <!-- 顶栏 -->
  <header id="top-bar">
    <button id="btn-menu" class="icon-btn editor-entry" aria-label="森林编辑器" title="打开森林编辑器">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3 4 15h5v6h6v-6h5Z"/></svg><span>森林编辑器 ↗</span>
    </button>
    <div id="timer-text" hidden>00:00</div>
    <div class="top-settings">
    <select id="language-select" aria-label="语言"><option value="zh">中文</option><option value="en">English</option><option value="fr">Français</option></select>
    <button id="btn-theme" class="icon-btn" aria-label="切换主题">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
    </button>
    </div>
  </header>

  <!-- 球区 -->
  <main id="ball-stage">
    <div id="ball-deco"><img id="ball-ground" alt="地面装饰" style="display:none"></div>
    <div id="ball-back"><img id="ball-bg-img" alt="球背景" src="assets/ball/plant_ball.webp"></div>
    <div id="ball-tree"><img id="tree-img" alt="树" src="assets/trees/tree_type_88_phase_4.webp"></div>
    <div id="ball-glow"></div>
  </main>

const ssrc=(id,ph,suf)=>{const p=TREE_IMAGE_PATHS[id+'_'+ph+(suf||'')];return p?[p]:[];};
const IMAGE_PLACEHOLDER='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="18" fill="#edf5ef"/><path d="M60 20L30 76H52V99H68V76H90Z" fill="#6b9a75"/></svg>');
const skinSuf=()=>ST.theme==='xmas'?'_christmas':'';
function zhOf(id){return treeText(id);}
function hasFrames(st,id,ph){return Boolean(FRAME_PATHS[st+'_'+id+'_'+ph]?.length);}
function loadImg(el,urls){ /* 直接设置实际图片元素的路径，失败时按清单回退 */
  const requestId=(Number(el.dataset.loadRequest)||0)+1;
  el.dataset.loadRequest=String(requestId);
  const candidates=[...new Set(urls.filter(Boolean))];
  let i=0;
  const tryNext=()=>{
    if(requestId!==Number(el.dataset.loadRequest))return;
    if(i>=candidates.length){el.onload=null;el.onerror=null;el.classList.remove('image-missing');el.src=IMAGE_PLACEHOLDER;el.alt=tr('missing');return;}
    el.classList.remove('image-missing');
    el.onload=()=>{if(requestId===Number(el.dataset.loadRequest)){el.onload=null;el.onerror=null;el.classList.remove('image-missing');}};
    el.onerror=()=>{if(requestId===Number(el.dataset.loadRequest))tryNext();};
    el.src=candidates[i++];
  };
  tryNext();
}function staticUrls(id,phase,suf){
  const urls=[];
  if(phase>=3&&suf)urls.push(...ssrc(id,phase,suf));
  urls.push(...ssrc(id,phase));
  for(let p=phase-1;p>=1;p--)urls.push(...ssrc(id,p));
  urls.push(...ssrc(0,phase));
  for(let p=phase-1;p>=1;p--)urls.push(...ssrc(0,p));
  return urls;
}
/* 最成熟版本预览（选树面板：优先最高阶段，xmas 主题优先圣诞变体）*/
function matureUrls(id){
  const t=TREES.find(r=>r[0]===id); if(!t)return ssrc(0,1);
  const max=Math.max(t[4],t[6]);
  const suf=skinSuf();
  const urls=[];
  if(suf)urls.push(...ssrc(id,max,suf));
  urls.push(...ssrc(id,max));
  for(let p=max-1;p>=1;p--)urls.push(...ssrc(id,p));
  return urls;
}
function fmt(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return pad(m)+':'+pad(s);}
function toast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:40;background:rgba(30,40,34,.88);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;max-width:78vw;box-shadow:0 6px 20px rgba(0,0,0,.2);';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1900);
}

/* ===== 帧动画播放器（AnimationDrawable 复刻：83ms/帧，队列式 sequence）===== */
const player={timer:null,seq:[],idx:0,f:0,running:false,onDone:null};
function stopPlayer(){clearInterval(player.timer);player.running=false;}
function playSeq(seq,onDone){
  stopPlayer();
  player.onDone=null;
  const ok=seq.filter(s=>hasFrames(s.st,ST.tree,s.ph)).map(s=>({...s}));
  if(!ok.length){if(onDone)onDone();return;}
  player.seq=ok;player.idx=0;player.f=0;player.running=true;player.onDone=onDone;
  const step=()=>{
    const s=player.seq[player.idx];
    if(!s){stopPlayer();const cb=player.onDone;player.onDone=null;if(cb)cb();return;}
    treeImg.onload=null;treeImg.onerror=null;treeImg.classList.remove('image-missing');
    const frameList=FRAME_PATHS[s.st+'_'+ST.tree+'_'+s.ph];
    treeImg.src=frameList[player.f];
    player.f++;
    if(player.f>=frameList.length){
      player.f=0;s.rep--;
      if(s.rep<=0){
        player.idx++;
        if(player.idx>=player.seq.length){stopPlayer();const cb=player.onDone;player.onDone=null;if(cb)cb();return;}
      }
    }
  };
  step();
  player.timer=setInterval(step,FRAME_MS);
}
/* 日常 Flow（active×1 → idle×2 → active×1 → idle×3 → active×1 → idle×1，无限）*/
function dailySeq(ph){return[{st:'active',ph,rep:1},{st:'idle',ph,rep:2},{st:'active',ph,rep:1},{st:'idle',ph,rep:3},{st:'active',ph,rep:1},{st:'idle',ph,rep:1}];}
function startDaily(){
  const seq=dailySeq(ST.phase).filter(s=>hasFrames(s.st,ST.tree,s.ph));
  if(!seq.length){stopPlayer();loadImg(treeImg,staticUrls(ST.tree,ST.phase,skinSuf()));return;}
  playSeq(seq,()=>{if(ST.state==='growing')startDaily();});
}

/* ===== 状态渲染 ===== */
function renderState(){
  const s=ST.state;
  $('plant-controls').style.display=(s==='plant')?'flex':'none';
  growingInfo.style.display=(s==='growing')?'block':'none';
  btnHarvest.style.display=(s==='result')?'block':'none';
}
function setTreeVisual(scaleAnim){
  if(scaleAnim){
    treeImg.style.transform='scale(.7)';
    requestAnimationFrame(()=>{requestAnimationFrame(()=>{treeImg.style.transform='scale(1)';});});
  }
  tagName.textContent=zhOf(ST.tree);
}
function showPlantTree(){
  stopPlayer();
  ST.phase=Math.max(...(TREE_PHASES[ST.tree]||[1]));
  if(hasFrames('idle',ST.tree,ST.phase)){
    playSeq([{st:'idle',ph:ST.phase,rep:Infinity}],null);
  }else{
    loadImg(treeImg,matureUrls(ST.tree));
  }
}
function resetPlantPreview(){
  clearInterval(tickTimer);tickTimer=null;growStart=0;
  ST.state='plant';btnPlant.disabled=false;
  $('btn-start').disabled=false;
  timerText.textContent=fmt(ST.dur*60);
  growRemain.textContent=timerText.textContent;progressFill.style.width='0%';
  renderState();showPlantTree();
}
function beginGrow(){
  btnPlant.disabled=false;clearInterval(tickTimer);ST.state='growing';ST.phase=1;growStart=Date.now();
  progressFill.style.width='0%';growRemain.textContent=fmt(ST.dur*60);timerText.textContent=fmt(ST.dur*60);
  renderState();startDaily();
  tickTimer=setInterval(tickGrow,250);
}
function tickGrow(){
  if(ST.state!=='growing')return;
  const real=(Date.now()-growStart)/1000;
  const virt=real*ST.speed,total=ST.dur*60;
  const p=Math.min(1,virt/total);
  progressFill.style.width=(p*100).toFixed(1)+'%';
  growRemain.textContent=fmt(Math.max(0,Math.ceil(total-virt)));timerText.textContent=growRemain.textContent;
  const stages=TREE_PHASES[ST.tree]||[1];
  const np=stages[Math.min(stages.length-1,Math.floor(p*stages.length))];
  if(np!==ST.phase){
    ST.phase=np;
    if(ANIM_ID.has(ST.tree)){startDaily();}
    else{loadImg(treeImg,staticUrls(ST.tree,ST.phase,skinSuf()));}
  }
  if(p>=1)finishGrow();
}
function finishGrow(){
  clearInterval(tickTimer);
  ST.state='result';timerText.textContent='00:00';stopPlayer();
  const t=TREES.find(r=>r[0]===ST.tree);
  const mp=Math.max(t?t[4]:7,t?t[6]:0)||7;
  loadImg(treeImg,staticUrls(ST.tree,mp,skinSuf()));
  fxFlash();renderState();
}
function fxFlash(){$('fx-layer').classList.add('show');setTimeout(()=>$('fx-layer').classList.remove('show'),1700);}

/* ===== 主题 ===== */
function applyTheme(){
  document.body.dataset.theme=ST.theme;
  $('bg-gradient').style.background=THEMES[ST.theme].color;
  loadImg($('ball-bg-img'),[THEMES[ST.theme].ball]);
  const g=THEMES[ST.theme].ground,gEl=$('ball-ground');
  gEl.style.display=g?'block':'none';
  if(g)loadImg(gEl,[g]);
  renderThemeGrid();
  if(ST.state==='plant')showPlantTree();
  else if(ST.state==='result')loadImg(treeImg,matureUrls(ST.tree));
  else if(!ANIM_ID.has(ST.tree))loadImg(treeImg,staticUrls(ST.tree,ST.phase,skinSuf()));
  renderGrid();if(ST.selTree!=null)updatePreview(ST.selTree);
}
function renderThemeGrid(){
  const tg=$('theme-grid');
  tg.innerHTML='';
  Object.keys(THEMES).forEach(k=>{
    const T=THEMES[k];
    const item=document.createElement('button');
    item.className='theme-item'+(ST.theme===k?' sel':'');
    const sw=document.createElement('div');sw.className='theme-swatch';
    const [themeName,themeDescription]=themeText(k);
    const img=document.createElement('img');img.alt=themeName;loadImg(img,[T.ground||T.ball]);
    sw.appendChild(img);
    const info=document.createElement('div');info.className='tinfo';
    const n=document.createElement('div');n.className='tn';n.textContent=themeName+(T.snow?' · '+tr('snow'):'');
    const d=document.createElement('div');d.className='td';d.textContent=themeDescription;
    info.appendChild(n);info.appendChild(d);

    item.appendChild(sw);item.appendChild(info);item.appendChild(ck);
    item.onclick=()=>{ST.theme=k;applyTheme();closeThemeSheet();toast(tr('themeChanged',{name:themeName}));};
    tg.appendChild(item);
  });
}

/* ===== 雪花（SnowfallView 复刻：40 片、10-30px、alpha 128-255、淡入淡出）===== */
function spawnSnow(){
  const layer=$('snow-layer');
  if(layer.childElementCount)return;
  for(let i=0;i<40;i++){
    const f=document.createElement('i');
    f.className='flake';
    const size=10+Math.random()*20;
    f.style.cssText='left:'+(Math.random()*100).toFixed(1)+'%;width:'+size.toFixed(0)+'px;height:'+size.toFixed(0)+'px;opacity:'+(0.5+Math.random()*0.5).toFixed(2)+';animation-duration:'+(9+Math.random()*14).toFixed(1)+'s;animation-delay:-'+(Math.random()*22).toFixed(1)+'s;filter:blur('+(Math.random()>.7?1.2:0).toFixed(1)+'px);';
    layer.appendChild(f);
  }
}

/* ===== 树选择面板 ===== */
function openSheet(){mask.classList.add('show');sheet.classList.add('open');}
function closeSheet(){mask.classList.remove('show');sheet.classList.remove('open');}
function openThemeSheet(){mask.classList.add('show');themeSheet.classList.add('open');}
function closeThemeSheet(){mask.classList.remove('show');themeSheet.classList.remove('open');}
function renderGrid(){
  const kw=$('search-input').value.trim().toLowerCase();
  grid.innerHTML='';
  TREES.forEach(t=>{
    const id=t[0],zh=treeText(id),en=t[2],anim=t[3];
    if(ST.tab==='anim'&&!anim)return;
    if(ST.tab==='fav'&&!ST.fav.has(id))return;
    const meta=TREE_METADATA[id]||{};
    if(kw&&![zh,en,t[1],meta.nameFR,String(id)].some(name=>String(name||'').toLocaleLowerCase().includes(kw)))return;
    const cell=document.createElement('button');
    cell.className='tree-cell'+(id===ST.selTree?' sel':'');
    cell.dataset.treeId=id;cell.setAttribute('aria-pressed',String(id===ST.selTree));
    const img=document.createElement('img');img.alt=zh;img.loading='lazy';
    loadImg(img,matureUrls(id));
    cell.appendChild(img);
    const n=document.createElement('div');n.className='tname';n.textContent=zh;
    cell.appendChild(n);
    if(anim){const a=document.createElement('div');a.className='tanim';a.textContent=tr('badge');cell.appendChild(a);}
    cell.onclick=()=>selectTree(id);
    grid.appendChild(cell);
  });
  if(ST.tab==='fav'&&!grid.children.length){
    const empty=document.createElement('p');empty.className='favorites-empty';
    empty.textContent=tr(ST.fav.size?'noMatch':'noFavorites');grid.appendChild(empty);
  }
}
function updatePreview(id){
  const t=TREES.find(r=>r[0]===id);if(!t)return;
  const meta=TREE_METADATA[id]||{};
  const name=treeText(id);
  previewName.textContent=name;
  const favorite=$('btn-favorite'),saved=ST.fav.has(id);
  favorite.textContent=(saved?'★ ':'☆ ')+tr(saved?'favorited':'favorite');favorite.setAttribute('aria-pressed',String(saved));
  favorite.setAttribute('aria-label',tr(saved?'unfavorite':'favorite')+' '+name);
  $('plant-selection').textContent=name;
  previewSub.textContent=[treeText(id,'description'),tr(t[3]?'animated':'static'),tr('stages',{n:TREE_PHASES[id].length}),'ID '+id].filter(Boolean).join(' · ');
  loadImg(previewImg,matureUrls(id));
}
function selectTree(id){
  ST.selTree=id;
  grid.querySelectorAll('.tree-cell').forEach(cell=>{const selected=Number(cell.dataset.treeId)===id;cell.classList.toggle('sel',selected);cell.setAttribute('aria-pressed',String(selected));});
  updatePreview(id);
  saveMainState();
}

/* ===== 种植交互 ===== */
function plantSelected(){
  if(ST.selTree==null)return;
  ST.tree=ST.selTree;
  closeSheet();
  resetPlantPreview();
  setTreeVisual(true);
  saveMainState();
}
function startPlanting(){
  if(ST.state!=='plant'||$('btn-start').disabled)return;
  btnPlant.disabled=true;$('btn-start').disabled=true;
  setTreeVisual(true);
  if(!ANIM_ID.has(ST.tree)){
    loadImg(treeImg,staticUrls(ST.tree,1,skinSuf()));
  }
  beginGrow();
}

/* ===== 事件绑定 ===== */
$('btn-favorite').onclick=()=>{
  const id=ST.selTree;if(id==null)return;

mask.onclick=()=>{closeSheet();closeThemeSheet();};

document.querySelectorAll('.sheet-tabs .tab').forEach(tab=>{

    document.querySelectorAll('.sheet-tabs .tab').forEach(t=>t.classList.remove('active'));

$('growing-info').addEventListener('click',()=>{
  const now=Date.now(),elapsed=(now-growStart)*ST.speed;

/* ===== 初始化 ===== */
const MAIN_STATE_KEY='forest-main-state-v1';
function saveMainState(){
  try{localStorage.setItem(MAIN_STATE_KEY,JSON.stringify({tree:ST.tree,selTree:ST.selTree,theme:ST.theme,
    tab:ST.tab,dur:ST.dur,speed:ST.speed,state:ST.state,phase:ST.phase,growStart,search:$('search-input').value}));}catch(error){}
}
function restoreMainState(){
  let saved;try{saved=JSON.parse(localStorage.getItem(MAIN_STATE_KEY)||'null');}catch(error){return;}
  if(!saved||typeof saved!=='object')return;
  if(TREES.some(t=>t[0]===saved.tree))ST.tree=saved.tree;
  ST.selTree=TREES.some(t=>t[0]===saved.selTree)?saved.selTree:ST.tree;
  if(Object.hasOwn(THEMES,saved.theme))ST.theme=saved.theme;
  if(['all','anim','fav'].includes(saved.tab))ST.tab=saved.tab;
  if(Number.isFinite(saved.dur)&&saved.dur>=1&&saved.dur<=180)ST.dur=saved.dur;
  if([1,120].includes(saved.speed))ST.speed=saved.speed;
  if(typeof saved.search==='string')$('search-input').value=saved.search.slice(0,200);
  document.querySelectorAll('.sheet-tabs .tab').forEach(button=>button.classList.toggle('active',button.dataset.tab===ST.tab));
}
restoreMainState();
$('language-select').onchange=event=>{
  if(!Object.hasOwn(FOREST_MESSAGES,event.target.value))return;
  forestLanguage=event.target.value;
  try{localStorage.setItem('forest-language',forestLanguage);}catch(error){}
  applyLanguage();
};
applyLanguage();
function syncLanguage(){const next=readForestLanguage();if(next!==forestLanguage){forestLanguage=next;applyLanguage();}}
window.addEventListener('storage',event=>{if(event.key==='forest-language'||event.key===null)syncLanguage();});
window.addEventListener('pageshow',syncLanguage);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncLanguage();});
window.addEventListener('pagehide',saveMainState);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveMainState();});
for(const event of ['click','change','input'])document.addEventListener(event,()=>{setTimeout(saveMainState,0);});
spawnSnow();
timerText.textContent=fmt(ST.dur*60);
renderThemeGrid();
applyTheme();
renderState();
setTreeVisual(false);
resetPlantPreview();
renderGrid();
selectTree(ST.selTree);
// Only the loopback app server exposes this read-only endpoint.
let liveRevision='';
let liveSyncBusy=false;
async function syncTreeData(){
  if(liveSyncBusy)return;
  liveSyncBusy=true;
  const status=$('data-sync-status');
  try{
    const response=await fetch('/api/tree-data',{cache:'no-store'});
    if(!response.ok)throw new Error('暂时无法读取树种数据');
    const data=await response.json();
    if(!Array.isArray(data.trees)||!data.trees.length||!data.metadata||!data.phases||!data.frames||!data.imagePaths||!data.revision)throw new Error('数据不完整');
    if(data.revision===liveRevision){status.textContent=tr('synced',{n:TREES.length});return;}
    if(ST.state!=='plant'||btnPlant.disabled){status.textContent=tr('pending');return;}
    TREES=data.trees;TREE_METADATA=data.metadata;TREE_PHASES=data.phases;
    FRAME_PATHS=data.frames;TREE_IMAGE_PATHS=data.imagePaths;
    ANIM_ID.clear();TREES.filter(t=>t[3]).forEach(t=>ANIM_ID.add(t[0]));
    if(!TREES.some(t=>t[0]===ST.tree))ST.tree=TREES[0][0];
    if(!TREES.some(t=>t[0]===ST.selTree))ST.selTree=ST.tree;
    liveRevision=data.revision;
    setTreeVisual(false);renderGrid();updatePreview(ST.selTree);showPlantTree();
    status.textContent=tr('synced',{n:TREES.length});
  }catch(error){
    status.textContent=tr('syncError');
  }finally{liveSyncBusy=false;}
}
function startLiveUpdates(){
  const status=$('data-sync-status');
  if(!['localhost','127.0.0.1','[::1]'].includes(location.hostname)){
    return;
  }
  syncTreeData();
  setInterval(syncTreeData,5000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncTreeData();});
}
startLiveUpdates();
